# Language-neutral Nix checks and optional package builds on one runner.
# The caller owns the platform matrix and chooses any named checks/build targets.
name: Nix Checks

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image, e.g. ubuntu-latest, ubuntu-24.04-arm, macos-latest."
        type: string
        default: "ubuntu-latest"
      working-directory:
        description: "Directory containing the flake; all command steps run here."
        type: string
        default: "."
      timeout-minutes:
        description: "Job timeout. GitHub's own default is 360."
        type: number
        default: 60
      install-nix:
        description: "Install Nix before running commands. Disable for runners with Nix already installed."
        type: boolean
        default: true
      extra-nix-config:
        description: "Additional nix.conf settings passed to install-nix-action."
        type: string
        default: ""
      cache:
        description: "Restore the Nix store from the Actions cache, falling back to the default branch's entry."
        type: boolean
        default: false
      cache-save:
        description: "Also save the store and purge this ref's older entries. The caller must grant actions: write."
        type: boolean
        default: false
      cache-key:
        description: "Cache key prefix; jobs that should share a store use the same one. Defaults to nix-<repository name>."
        type: string
        default: ""
      cache-hash-files:
        description: "Newline-separated globs, relative to the repository root, whose contents key the cache."
        type: string
        default: |
          **/*.nix
          **/flake.lock
          **/Cargo.toml
          **/Cargo.lock
          **/*.rs
      setup-command:
        description: "Optional shell script run before the checks and build, with Nix available."
        type: string
        default: ""
      flake-check:
        description: "Run the flake check."
        type: boolean
        default: true
      flake-check-command:
        description: "Shell script run when flake-check is enabled."
        type: string
        default: "nix flake check --print-build-logs"
      build:
        description: "Also build the flake's default package or a custom target."
        type: boolean
        default: false
      build-command:
        description: "Shell script run when build is enabled; can select a named package or check."
        type: string
        default: "nix build --print-build-logs"

jobs:
  checks:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      CACHE_KEY: ${{ inputs.cache-key || format('nix-{0}', github.event.repository.name) }}
      CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && 'merge-queue' || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: inputs.install-nix && (inputs.flake-check || inputs.build || inputs.setup-command != '')
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ inputs.extra-nix-config }}

      # Entries are scoped per ref and each ref purges only its own, so a PR
      # never deletes the default branch's entry that every other ref restores.
      - name: Nix store cache
        if: inputs.cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-${{ hashFiles(inputs.cache-hash-files) }}
          restore-prefixes-first-match: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
            ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
          save: ${{ inputs.cache-save }}
          gc-max-store-size: 8G
          purge: ${{ inputs.cache-save }}
          purge-prefixes: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Setup
        if: inputs.setup-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Check flake
        if: inputs.flake-check
        working-directory: ${{ inputs.working-directory }}
        env:
          FLAKE_CHECK_COMMAND: ${{ inputs.flake-check-command }}
        run: bash -euo pipefail -c "$FLAKE_CHECK_COMMAND"

      - name: Build
        if: inputs.build
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
