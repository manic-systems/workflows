# Build a project with Nix on one runner. Dual-use:
#   * CI:      call with upload=false (the default) to verify the build compiles.
#   * Release: call with upload=true + version/suffix to attest and upload the
#              built binary as a release asset.
# Tests / clippy / fmt belong in rust-checks.yml — this workflow only builds.
# The caller drives the matrix (one call per runner) and owns its permissions —
# upload=true requires the caller to grant contents/id-token/attestations write.
name: Build

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image, e.g. ubuntu-latest, ubuntu-24.04-arm, macos-latest."
        type: string
        required: true
      build-command:
        description: "Command that builds the project. Defaults to `nix build` (the flake's default package)."
        type: string
        default: "nix build"
      working-directory:
        description: "Directory the build runs in. Set for projects living in a subdirectory; artifact-path is resolved relative to it."
        type: string
        default: "."
      install-nix:
        description: "Install Nix before building."
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout. GitHub's own default is 360."
        type: number
        default: 60
      extra-nix-config:
        description: "Additional nix.conf settings passed to install-nix-action."
        type: string
        default: ""
      cache:
        description: "Restore the Nix store from the Actions cache, falling back to the default branch's entry."
        type: boolean
        default: false
      cache-save:
        description: "Also save the store and purge this ref's older entries. The caller must grant actions: write."
        type: boolean
        default: false
      cache-key:
        description: "Cache key prefix; jobs that should share a store use the same one. Defaults to nix-<repository name>."
        type: string
        default: ""
      cache-hash-files:
        description: "Newline-separated globs, relative to the repository root, whose contents key the cache."
        type: string
        default: |
          **/*.nix
          **/flake.lock
          **/Cargo.toml
          **/Cargo.lock
          **/*.rs
      upload:
        description: "Attest provenance and upload the built binary to a release. Leave false for plain CI builds."
        type: boolean
        default: false
      version:
        description: "Required when upload=true: the release tag to upload the asset to."
        type: string
        default: ""
      suffix:
        description: "Required when upload=true: asset filename suffix; the asset is <asset-prefix>-<suffix>."
        type: string
        default: ""
      binary-name:
        description: "Built binary name under the build output. Defaults to the repository name."
        type: string
        default: ""
      asset-prefix:
        description: "Prefix for the asset filename. Defaults to the repository name."
        type: string
        default: ""
      artifact-path:
        description: "Path to the built binary. Defaults to result/bin/<binary-name>."
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      CACHE_KEY: ${{ inputs.cache-key || format('nix-{0}', github.event.repository.name) }}
      CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && 'merge-queue' || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: inputs.install-nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ inputs.extra-nix-config }}

      # Entries are scoped per ref and each ref purges only its own, so a PR
      # never deletes the default branch's entry that every other ref restores.
      - name: Nix store cache
        if: inputs.cache && !inputs.upload
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-${{ hashFiles(inputs.cache-hash-files) }}
          restore-prefixes-first-match: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
            ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
          save: ${{ inputs.cache-save }}
          gc-max-store-size: 8G
          purge: ${{ inputs.cache-save }}
          purge-prefixes: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Prepare binary
        if: inputs.upload
        working-directory: ${{ inputs.working-directory }}
        env:
          BINARY_NAME: ${{ inputs.binary-name || github.event.repository.name }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          ASSET_PREFIX: ${{ inputs.asset-prefix || github.event.repository.name }}
          SUFFIX: ${{ inputs.suffix }}
        run: |
          BIN="${BINARY_NAME}"
          ART="${ARTIFACT_PATH}"
          [ -n "$ART" ] || ART="result/bin/${BIN}"
          ASSET="${ASSET_PREFIX}-${SUFFIX}"
          cp -L "$ART" "${GITHUB_WORKSPACE}/${ASSET}"
          chmod +w "${GITHUB_WORKSPACE}/${ASSET}"
          echo "asset=${ASSET}" >> "$GITHUB_ENV"

      - name: Attest build provenance
        if: inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.asset }}

      - name: Upload Release Asset
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TAG: ${{ inputs.version }}
          UPLOAD_ASSET: ${{ env.asset }}
        run: gh release upload "${UPLOAD_TAG}" "${UPLOAD_ASSET}" --clobber
