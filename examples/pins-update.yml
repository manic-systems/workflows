# Copy this into a consuming repo as .github/workflows/pins-update.yml.
name: Pins Update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: manic-systems/workflows/.github/workflows/pins-update.yml@v2
    with:
      client-id: ${{ vars.MANIC_BOT_CLIENT_ID }}
      # tack-arguments: --exclude nixpkgs
      # flake-arguments: nixpkgs
      # auto-merge: true
    secrets:
      private-key: ${{ secrets.MANIC_BOT_PRIVATE_KEY }}
