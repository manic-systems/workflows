# Rust CI checks on one runner. Nix-first by default (`nix flake check`), with
# opt-in cargo test / clippy / fmt for repos that want them in addition to or
# instead of the flake check. Designed to be called per matrix leg from the
# consuming repo's CI workflow.
#
# All steps are toggleable. The defaults: flake-check ON; cargo steps OFF.
# Cargo steps run inside the flake's dev shell unless rust-toolchain is set.
name: Rust Checks

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image, e.g. ubuntu-latest, ubuntu-26.04-arm, macos-latest."
        type: string
        required: true
      working-directory:
        description: "Directory the cargo steps run in. Set for crates living in a subdirectory; the flake check still runs from the repo root."
        type: string
        default: "."

      # Nix
      install-nix:
        description: "Install Nix (needed by `nix flake check` and the dev shell)."
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout. GitHub's own default is 360."
        type: number
        default: 60
      extra-nix-config:
        description: "Additional nix.conf settings passed to install-nix-action."
        type: string
        default: ""
      flake-check:
        description: "Run the flake-check command."
        type: boolean
        default: true
      flake-check-command:
        description: "Shell script run when flake-check is true."
        type: string
        default: "nix flake check --print-build-logs"

      # Rust toolchain
      rust-toolchain:
        description: "Empty runs cargo steps in the flake's dev shell. Set a channel (stable, nightly, 1.85) to install it with rustup instead, for repos without a dev shell."
        type: string
        default: ""
      rust-targets:
        description: "Comma-separated extra targets installed with a rustup toolchain, e.g. wasm32v1-none. Dev-shell repos declare targets in the flake."
        type: string
        default: ""

      setup-command:
        description: "Shell script run before the cargo steps, with Nix available (e.g. to install tools from the repo flake)."
        type: string
        default: ""

      # Cargo opt-ins
      test:
        description: "Run the test command."
        type: boolean
        default: false
      test-command:
        type: string
        default: "cargo test --workspace --all-features"
      clippy:
        description: "Run the clippy command."
        type: boolean
        default: false
      clippy-command:
        type: string
        default: "cargo clippy --workspace --all-targets --all-features -- -D warnings"
      fmt:
        description: "Run the fmt command."
        type: boolean
        default: false
      fmt-command:
        type: string
        default: "cargo fmt --all --check"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      DEV_SHELL: ${{ inputs.rust-toolchain == '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: >-
          inputs.install-nix && (inputs.flake-check || inputs.setup-command != '' ||
          (inputs.rust-toolchain == '' && (inputs.test || inputs.clippy || inputs.fmt)))
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            ${{ inputs.extra-nix-config }}
            extra-experimental-features = nix-command flakes

      - name: Set up Rust
        if: inputs.rust-toolchain != '' && (inputs.test || inputs.clippy || inputs.fmt)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt
          target: ${{ inputs.rust-targets }}
          # The action defaults RUSTFLAGS to "-D warnings", which replaces the
          # repo's build.rustflags from .cargo/config.toml.
          rustflags: ""

      - name: Setup
        if: inputs.setup-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: cargo fmt
        if: ${{ !cancelled() && inputs.fmt }}
        working-directory: ${{ inputs.working-directory }}
        env:
          FMT_COMMAND: ${{ inputs.fmt-command }}
        run: |
          if [[ "$DEV_SHELL" == true ]]; then
            nix develop --command bash -euo pipefail -c "$FMT_COMMAND"
          else
            bash -euo pipefail -c "$FMT_COMMAND"
          fi

      - name: cargo clippy
        if: ${{ !cancelled() && inputs.clippy }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CLIPPY_COMMAND: ${{ inputs.clippy-command }}
        run: |
          if [[ "$DEV_SHELL" == true ]]; then
            nix develop --command bash -euo pipefail -c "$CLIPPY_COMMAND"
          else
            bash -euo pipefail -c "$CLIPPY_COMMAND"
          fi

      - name: cargo test
        if: ${{ !cancelled() && inputs.test }}
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [[ "$DEV_SHELL" == true ]]; then
            nix develop --command bash -euo pipefail -c "$TEST_COMMAND"
          else
            bash -euo pipefail -c "$TEST_COMMAND"
          fi

      - name: nix flake check
        if: ${{ !cancelled() && inputs.flake-check }}
        env:
          FLAKE_CHECK_COMMAND: ${{ inputs.flake-check-command }}
        run: bash -euo pipefail -c "$FLAKE_CHECK_COMMAND"
