# Release bookkeeping that brackets the build matrix. Called by the caller with
# a `stage` input selecting one of:
#   * prepare  — before the matrix: version check, tag, create the release.
#   * finalize — after the matrix: release notes + SHA256SUMS.
#   * publish  — optional: publish to crates.io via Trusted Publishing (OIDC,
#                no API token). Wire it after finalize.
# The build itself is the separate rust-build.yml, invoked per matrix leg.
name: Release

on:
  workflow_call:
    inputs:
      stage:
        description: "'prepare' (tag + create release), 'finalize' (notes + checksums), or 'publish' (crates.io)."
        type: string
        required: true
      version:
        description: "Required for stage=finalize/publish: the tag produced by the prepare stage."
        type: string
        default: ""
      version-command:
        description: "prepare: shell command that prints the bare version (no tag prefix) to stdout."
        type: string
        default: "nix run nixpkgs#fq -- -r '.workspace.package.version' Cargo.toml"
      tag-prefix:
        description: "prepare: prefix prepended to the version to form the git tag."
        type: string
        default: "v"
      default-branch:
        description: "prepare: branch used to detect whether the version changed."
        type: string
        default: "main"
      install-nix:
        description: "prepare: install Nix before reading the version."
        type: boolean
        default: true
      asset-prefix:
        description: "finalize: prefix of the assets to checksum. Defaults to the repository name."
        type: string
        default: ""
      publish-command:
        description: "publish: command that publishes to crates.io. CARGO_REGISTRY_TOKEN is set from the Trusted Publishing exchange."
        type: string
        default: "cargo publish"
      publish-working-directory:
        description: "publish: directory the publish command runs in. Set for a crate in a subdirectory."
        type: string
        default: "."
      publish-environment:
        description: "publish: GitHub Environment to run the publish job in. Match the environment set on the crates.io Trusted Publisher config; empty means none."
        type: string
        default: ""
      rust-toolchain:
        description: "publish: Rust toolchain channel installed before publishing."
        type: string
        default: "stable"
    outputs:
      version:
        description: "prepare: the computed tag, e.g. v1.2.3."
        value: ${{ jobs.prepare.outputs.version }}
      skip:
        description: "prepare: true when the version is unchanged and the release should be skipped."
        value: ${{ jobs.prepare.outputs.skip }}

permissions:
  contents: write

jobs:
  validate-stage:
    if: inputs.stage != 'prepare' && inputs.stage != 'finalize' && inputs.stage != 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Reject invalid stage
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          echo "::error::stage must be prepare, finalize, or publish; got: $STAGE"
          exit 1

  # ---- stage: prepare ----
  prepare:
    if: inputs.stage == 'prepare'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      skip: ${{ steps.check_version.outputs.skip_workflow }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        name: Checkout
        with:
          persist-credentials: false

      - name: Install Nix
        if: inputs.install-nix
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: read_version
        env:
          VERSION_COMMAND: ${{ inputs.version-command }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          RAW="$($VERSION_COMMAND)"
          echo "version=${TAG_PREFIX}${RAW}" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check_version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          echo "Checking if version $VERSION has changed since last tag..."

          if gh api "/repos/${REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on remote."
            echo "skip_workflow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version is new. Proceeding with release."
          echo "skip_workflow=false" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.check_version.outputs.skip_workflow != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.read_version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" \
            -f "sha=${SHA}"

          TAG_SHA=$(gh api "/repos/${REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')
          if [ "$TAG_SHA" = "$SHA" ]; then
            echo "Tag ${VERSION} successfully pushed to remote."
          else
            echo "::error:: Tag ${VERSION} does not point to ${SHA}." >&2
            exit 1
          fi

      - name: Detect pre-release
        id: prerelease_check
        if: steps.check_version.outputs.skip_workflow != 'true'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-.*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Create the release up front so the parallel rust-build legs upload
      # assets into an existing release instead of racing to create it.
      - name: Create Release
        if: steps.check_version.outputs.skip_workflow != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read_version.outputs.version }}
          IS_PRERELEASE: ${{ steps.prerelease_check.outputs.is_prerelease }}
        run: |
          FLAGS=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "$(cat <<EOF
          ## Release ${VERSION}

          **Note**: Assets will be uploaded once builds complete successfully.

          <!-- Changelog will be generated after successful asset uploads -->
          EOF
          )" \
            "${FLAGS[@]}"

  # ---- stage: finalize ----
  release-notes:
    if: inputs.stage == 'finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find previous stable release
        id: prev_stable
        env:
          CURRENT_TAG: ${{ inputs.version }}
        run: |
          # Fetch all tags
          git fetch --tags

          # Get all stable tags (pure semver: vX.Y.Z with no suffix)
          STABLE_TAGS=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)

          # Determine previous stable based on whether current is prerelease or stable
          if [[ "$CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.*$ ]]; then
            # Current is prerelease - get latest stable
            PREV_STABLE=$(echo "$STABLE_TAGS" | tail -n1)
          else
            # Current is stable - get the one before it
            PREV_STABLE=$(echo "$STABLE_TAGS" | grep -B1 "^${CURRENT_TAG}$" | head -n1)
            if [ "$PREV_STABLE" = "$CURRENT_TAG" ] || [ -z "$PREV_STABLE" ]; then
              # First release or not found - use the previous stable
              PREV_STABLE=$(echo "$STABLE_TAGS" | tail -n2 | head -n1)
            fi
          fi

          if [ -z "$PREV_STABLE" ]; then
            echo "::warning::No previous stable release found. This may be the first release."
          fi

          echo "previous_stable=${PREV_STABLE}" >> "$GITHUB_OUTPUT"
          echo "Found previous stable release: ${PREV_STABLE}"

      - name: Generate and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ inputs.version }}
          PREV_TAG: ${{ steps.prev_stable.outputs.previous_stable }}
        run: |
          # Generate release notes using GitHub API with custom previous tag
          NOTES_JSON=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${CURRENT_TAG}" \
            -f target_commitish="${{ github.sha }}" \
            -f previous_tag_name="${PREV_TAG}")

          # Extract the body from the JSON response
          RELEASE_BODY=$(echo "$NOTES_JSON" | jq -r '.body')

          # Update the release with the generated notes
          gh release edit "${CURRENT_TAG}" --notes "${RELEASE_BODY}"

  checksums:
    if: inputs.stage == 'finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve asset prefix
        id: prefix
        env:
          ASSET_PREFIX: ${{ inputs.asset-prefix || github.event.repository.name }}
        run: echo "value=${ASSET_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Download Assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          tag: ${{ inputs.version }}
          fileName: "${{ steps.prefix.outputs.value }}-*"
          out-file-path: "."

      # Github provides checksums for uploaded assets, and this will be our single
      # source of truth that verifies whether the provided checksums are the same
      # as the ones we've calculated.
      - name: Generate SHA256SUMS
        shell: bash
        env:
          ASSET_PREFIX: ${{ steps.prefix.outputs.value }}
        run: |
          mapfile -d '' files < <(find . -maxdepth 1 -type f -name "${ASSET_PREFIX}-*" -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            : > SHA256SUMS
          else
            for f in "${files[@]}"; do
            sha256sum "$f"
            done | sed 's|^\./||' > SHA256SUMS
          fi

      - name: Upload Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TAG: ${{ inputs.version }}
        run: gh release upload "${UPLOAD_TAG}" SHA256SUMS --clobber

  # ---- stage: publish ----
  # Publish to crates.io via Trusted Publishing: GitHub's OIDC identity is
  # exchanged for a short-lived registry token, so no CARGO_REGISTRY_TOKEN
  # secret is stored. Requires a one-time Trusted Publisher config on crates.io
  # (Settings → Trusted Publishing) for this repo, created after an initial
  # manual publish. The caller must grant `id-token: write` to this workflow.
  publish:
    if: inputs.stage == 'publish'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish-environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        working-directory: ${{ inputs.publish-working-directory }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISH_COMMAND: ${{ inputs.publish-command }}
        run: $PUBLISH_COMMAND
