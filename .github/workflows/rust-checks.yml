# Rust CI checks on one runner. Nix-first by default (`nix flake check`), with
# opt-in cargo test / clippy / fmt for repos that want them in addition to or
# instead of the flake check. Designed to be called per matrix leg from the
# consuming repo's CI workflow.
#
# All steps are toggleable. The defaults: flake-check ON; cargo steps OFF.
name: Rust Checks

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image, e.g. ubuntu-latest, ubuntu-24.04-arm, macos-latest."
        type: string
        required: true
      working-directory:
        description: "Directory the cargo steps run in. Set for crates living in a subdirectory; the flake check still runs from the repo root."
        type: string
        default: "."

      # Nix
      install-nix:
        description: "Install Nix (needed by `nix flake check`)."
        type: boolean
        default: true
      flake-check:
        description: "Run the flake-check command."
        type: boolean
        default: true
      flake-check-command:
        description: "Command run when flake-check is true."
        type: string
        default: "nix flake check"

      # Rust toolchain (only installed when any cargo step is enabled)
      rust-toolchain:
        description: "Rust toolchain channel passed to setup-rust-toolchain."
        type: string
        default: "stable"

      rust-targets:
        description: "Comma-separated extra targets installed with the toolchain, e.g. wasm32v1-none."
        type: string
        default: ""

      setup-command:
        description: "Shell script run before the cargo steps, with Nix available (e.g. to install tools from the repo flake)."
        type: string
        default: ""

      # Cargo opt-ins
      test:
        description: "Run cargo test."
        type: boolean
        default: false
      test-command:
        type: string
        default: "cargo test --all-features"
      clippy:
        description: "Run cargo clippy with -D warnings."
        type: boolean
        default: false
      clippy-command:
        type: string
        default: "cargo clippy --all-targets --all-features -- -D warnings"
      fmt:
        description: "Run cargo fmt --check."
        type: boolean
        default: false
      fmt-command:
        type: string
        default: "cargo fmt --all -- --check"

jobs:
  checks:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        if: inputs.install-nix && (inputs.flake-check || inputs.setup-command != '')
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        if: inputs.test || inputs.clippy || inputs.fmt
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt
          target: ${{ inputs.rust-targets }}

      - name: Setup
        if: inputs.setup-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: cargo fmt
        if: inputs.fmt
        working-directory: ${{ inputs.working-directory }}
        env:
          FMT_COMMAND: ${{ inputs.fmt-command }}
        run: bash -euo pipefail -c "$FMT_COMMAND"

      - name: cargo clippy
        if: inputs.clippy
        working-directory: ${{ inputs.working-directory }}
        env:
          CLIPPY_COMMAND: ${{ inputs.clippy-command }}
        run: bash -euo pipefail -c "$CLIPPY_COMMAND"

      - name: cargo test
        if: inputs.test
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: nix flake check
        if: inputs.flake-check
        env:
          FLAKE_CHECK_COMMAND: ${{ inputs.flake-check-command }}
        run: bash -euo pipefail -c "$FLAKE_CHECK_COMMAND"
