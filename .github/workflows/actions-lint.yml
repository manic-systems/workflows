# Lint the caller's GitHub Actions workflows with actionlint, which also runs
# shellcheck on `run:` scripts, and audit them for security issues with zizmor.
name: Actions Lint

on:
  workflow_call:
    inputs:
      zizmor-arguments:
        description: "Extra zizmor arguments, e.g. --min-severity medium or --persona pedantic."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for workflow changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}...${PR_HEAD}" ;;
            push) range="${PUSH_BEFORE}...${PUSH_AFTER}" ;;
            *) range="" ;;
          esac

          # The compare API lists at most 300 files, so a larger diff counts as
          # touching .github/, as do new branches and failed lookups.
          lint=true
          if [[ -n "$range" && "$range" != 0000000000000000000000000000000000000000...* ]]; then
            files=$(gh api "repos/${REPOSITORY}/compare/${range}" \
              --jq 'if (.files | length) >= 300 then ".github/" else .files[].filename end') || files=".github/"
            grep -q '^\.github/' <<< "$files" || lint=false
          fi
          echo "lint=${lint}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.lint == 'true'
        with:
          persist-credentials: false

      - name: Install Nix
        if: steps.changes.outputs.lint == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: actionlint
        if: steps.changes.outputs.lint == 'true'
        run: nix shell nixpkgs#actionlint nixpkgs#shellcheck --command actionlint

      - name: zizmor
        if: ${{ !cancelled() && steps.changes.outputs.lint == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_ARGUMENTS: ${{ inputs.zizmor-arguments }}
        run: |
          read -ra args <<< "$ZIZMOR_ARGUMENTS"
          nix run nixpkgs#zizmor -- --format github "${args[@]}" .
