# Check Markdown formatting independently of language-specific CI.
name: Markdown Formatting

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image."
        type: string
        default: "ubuntu-latest"
      working-directory:
        description: "Directory containing the Markdown files and optional Deno configuration."
        type: string
        default: "."
      deno-version:
        description: "Deno version or semver range passed to setup-deno."
        type: string
        default: "v2.x"

permissions:
  contents: read

jobs:
  format:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Check Markdown formatting
        working-directory: ${{ inputs.working-directory }}
        run: deno fmt --check '**/*.md'
